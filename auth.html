<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | BRAMBO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" type="image/x-icon" href="auth.png">
</head>

<body class="auth">
    <div id="wall" aria-hidden="true"></div>
    <div class="scrim"></div>
    <a href="index.html" class="brand auth-brand"><span class="brand-word">BRAMBO</span></a>
    <main class="auth-shell">
        <div class="auth-copy">
            <h1>Every show you watch, in one place.</h1>
            <p>Log episodes, save what is next and see what your friends are watching.</p>
        </div>
        <section class="auth-card">
            <div class="tabs" role="tablist"><button type="button" role="tab" id="t-login">Log in</button><button
                    type="button" role="tab" id="t-signup">Sign up</button></div>
            <form id="form" novalidate></form>
        </section>
    </main>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="auth.js"></script>
</body>

</html>
